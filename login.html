<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookFlow - Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        primary: '#2563eb', 
                        secondary: '#3b82f6', 
                        accent: '#f59e0b' 
                    } 
                } 
            } 
        }
    </script>
    <style>
        /* Custom styles for Webkit scrollbars and glowing effects */
        .glass-panel {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(148, 163, 184, 0.2);
        }
        .shield-glow {
            filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.6));
        }
        .bg-books {
            background-image: url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-slate-900 h-screen overflow-hidden text-gray-200 flex items-center justify-center relative font-sans">

    <!-- Atmospheric Books Background -->
    <div class="absolute inset-0 z-0 bg-books opacity-40 mix-blend-luminosity"></div>
    <!-- Deep Gradient Overlays for lighting -->
    <div class="absolute inset-0 z-0 bg-gradient-to-tr from-slate-950 via-slate-900/80 to-slate-900/90"></div>
    <div class="absolute top-0 left-0 w-[500px] h-[500px] bg-blue-600 rounded-full mix-blend-screen filter blur-[150px] opacity-20 pointer-events-none"></div>
    <div class="absolute bottom-0 right-0 w-[500px] h-[500px] bg-teal-500 rounded-full mix-blend-screen filter blur-[150px] opacity-10 pointer-events-none"></div>

    <!-- Loading Screen -->
    <div id="boot-loader" class="absolute inset-0 bg-slate-900 z-[300] flex flex-col items-center justify-center">
        <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-500 mb-4"></i>
        <p class="text-gray-400 font-medium tracking-wide">Checking Secure Session...</p>
    </div>

    <!-- Login Screen -->
    <div id="login-screen" class="relative z-[200] flex items-center justify-center w-full h-full p-4 hidden">
        <div class="glass-panel rounded-2xl shadow-2xl w-full max-w-md p-8 m-4">
            
            <!-- Header Section -->
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center mb-4">
                    <i class="fa-solid fa-shield shield-glow text-5xl text-transparent bg-clip-text bg-gradient-to-b from-cyan-300 to-blue-600"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-100 leading-snug">
                    <span class="text-blue-500">Publication</span> Books & <br>Inventory Management Portal
                </h1>
                <p class="text-gray-400 text-xs font-semibold mt-3 uppercase tracking-[0.2em]">Authorized Access Only</p>
                
                <!-- Setup Alert -->
                <div id="first-time-setup-alert" class="mt-5 bg-amber-950/50 text-amber-200 text-xs px-4 py-3 rounded-lg border border-amber-700/50 hidden text-left flex items-start gap-2 shadow-inner">
                    <i class="fa-solid fa-triangle-exclamation text-amber-500 mt-0.5"></i> 
                    <div>
                        <strong class="text-amber-400">System Uninitialized:</strong> No Admin found. Please run the secure backend setup script with your installation token.
                    </div>
                </div>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1.5 ml-1">Email Address</label>
                    <div class="relative">
                        <i class="fa-regular fa-envelope absolute left-4 top-3.5 text-gray-500 text-sm"></i>
                        <input type="email" id="login-email" placeholder="name@example.com" required class="w-full bg-slate-900/60 border border-slate-700/60 text-gray-200 rounded-xl pl-11 pr-4 py-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all placeholder-gray-600 shadow-inner">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1.5 ml-1">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-3.5 text-gray-500 text-sm"></i>
                        <input type="password" id="login-password" placeholder="••••••••" required class="w-full bg-slate-900/60 border border-slate-700/60 text-gray-200 rounded-xl pl-11 pr-10 py-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all placeholder-gray-600 font-mono text-sm tracking-widest shadow-inner">
                        <button type="button" class="absolute right-4 top-3.5 text-gray-500 hover:text-gray-300 transition-colors">
                            <i class="fa-regular fa-eye-slash text-sm"></i>
                        </button>
                    </div>
                </div>
                
                <!-- Options -->
                <div class="flex items-center justify-between pt-1 pb-2">
                    <label class="flex items-center text-xs text-gray-400 cursor-pointer hover:text-gray-200 transition-colors">
                        <input type="checkbox" class="mr-2 w-3.5 h-3.5 rounded border-gray-600 bg-slate-800 text-blue-500 focus:ring-blue-500 focus:ring-offset-slate-900">
                        Remember me
                    </label>
                    <a href="#" class="text-xs text-blue-400 hover:text-blue-300 transition-colors">Forgot Password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-xl shadow-[0_4px_14px_0_rgba(37,99,235,0.39)] hover:shadow-[0_6px_20px_rgba(37,99,235,0.23)] transition-all flex items-center justify-center gap-2 mt-2">
                    <i class="fa-solid fa-unlock-keyhole text-sm"></i> <span>Secure Login</span>
                </button>
            </form>

            <!-- Footer Section -->
            <div class="mt-6 text-center space-y-2">
                <p class="text-xs text-gray-400 hover:text-gray-200 transition-colors cursor-pointer flex items-center justify-center gap-1.5">
                    Need Help? <span class="text-blue-400">Contact Portal Support</span> <i class="fa-regular fa-circle-question text-[10px]"></i>
                </p>
                <p class="text-[10px] text-gray-500">
                    v2.4.1 &bull; Secure 256-bit Encryption
                </p>
            </div>
        </div>
    </div>
    
    <div id="toast-container" class="fixed bottom-4 right-4 z-[9999] flex flex-col gap-2"></div>

    <script>
        // Replace with your actual Supabase URL and Anon Key
        const SUPABASE_URL = 'https://hkvzvvkkojqhrkylbfie.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_dBhFFI7qAl_vj0T0uAjp1A_1jZxuGS_';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                // Reroute active sessions. Backend/Dashboard should verify role access.
                window.location.href = 'dashboard.html'; 
            } else {
                document.getElementById('boot-loader').classList.add('hidden');
                document.getElementById('login-screen').classList.remove('hidden');
                checkIfFirstSetup();
            }
        });

        // Checks if an admin exists to warn if initialization is needed
        async function checkIfFirstSetup() {
            // Note: This requires RLS policies to allow reading 'users' table or a specific public view
            const { data, error } = await supabaseClient.from('users').select('id').eq('role_id', 1).limit(1);
            if (!error && data.length === 0) {
                document.getElementById('first-time-setup-alert').classList.remove('hidden');
            }
        }

        // Auth Logic
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button'); 
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Authenticating...</span>';
            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: document.getElementById('login-email').value, 
                password: document.getElementById('login-password').value
            });

            if (error) { 
                showToast(error.message, 'error'); 
                btn.innerHTML = originalHTML;
                btn.disabled = false;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
            } else { 
                // Login successful. The dashboard page must perform role-based routing.
                window.location.href = 'dashboard.html'; 
            } 
        });

        function showToast(message, type = 'error') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-lg shadow-lg text-white text-sm font-medium flex items-center ${type === 'success' ? 'bg-emerald-600/90' : 'bg-rose-600/90'} backdrop-blur-md border ${type === 'success' ? 'border-emerald-500' : 'border-rose-500'}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check-circle' : 'fa-circle-exclamation'} mr-2 text-lg"></i>${message}`;
            container.appendChild(toast);
            
            // Setup entrance animation
            toast.animate([
                { transform: 'translateY(100%)', opacity: 0 },
                { transform: 'translateY(0)', opacity: 1 }
            ], { duration: 300, easing: 'ease-out' });

            setTimeout(() => {
                const anim = toast.animate([
                    { transform: 'translateY(0)', opacity: 1 },
                    { transform: 'translateY(100%)', opacity: 0 }
                ], { duration: 300, easing: 'ease-in' });
                anim.onfinish = () => toast.remove();
            }, 4000);
        }
    </script>
</body>
</html>
